<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Drone No-Fly Zone Simulator">
  <!-- restricted zone -->
  <g fill="none" stroke="#EDEDED" stroke-width="2.4" stroke-linecap="round">
    <circle cx="196" cy="86" r="44" stroke-dasharray="7 7" opacity="0.75"/>
    <circle cx="196" cy="86" r="22" opacity="0.4"/>
    <line x1="181" y1="71" x2="211" y2="101"/>
  </g>
  <!-- flight path: straight leg, then a diverted arc around the zone -->
  <g fill="none" stroke="#EDEDED" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 132 L104 118"/>
    <path d="M104 118 q46 -58 100 -44 q42 11 60 -10" stroke-dasharray="6 8" opacity="0.8"/>
  </g>
  <!-- start / destination markers -->
  <g fill="none" stroke="#EDEDED" stroke-width="2.4">
    <circle cx="28" cy="132" r="5"/>
    <path d="M292 64 l-8 12 8 12 8 -12 z"/>
  </g>
  <!-- drone -->
  <g fill="none" stroke="#EDEDED" stroke-width="2.4" stroke-linecap="round">
    <rect x="98" y="112" width="14" height="10" rx="2.5" fill="#EDEDED" stroke="none"/>
    <line x1="92" y1="106" x2="118" y2="106"/>
    <line x1="92" y1="102" x2="92" y2="110"/>
    <line x1="118" y1="102" x2="118" y2="110"/>
  </g>
  <!-- text -->
  <text x="26" y="164" fill="#EDEDED" font-family="'Courier New', monospace" font-size="17" font-weight="700" letter-spacing="1">NO-FLY ZONE SIM</text>
  <text x="26" y="184" fill="#8A8A8A" font-family="'Courier New', monospace" font-size="11" letter-spacing="2">GEOSPATIAL · GPS SPOOFING RESEARCH</text>
</svg>
